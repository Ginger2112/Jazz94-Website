<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{margin:0}</style>
</head>
<body>
<title>Jazz94 Mockup Canvas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a slim control bar (level, page, device) over a stage that holds the live site, either full width (desktop) or in a 390 px phone frame (mobile). The chrome is neutral and theme-aware; the site inside keeps the fixed Jazz94 brand palette. */
:root {
  --c-bg: #EFEDF0; --c-bar: #FFFFFF; --c-fg: #1C1A22; --c-mu: #5E5A68; --c-ln: #DDDAE2;
  --c-on: #1C0B12; --c-on-fg: #FFFBFA; --c-frame: #1C1A22;
  --bx: #9E1F45; --ch: #E9D3A6; --chl: #F6EDDC; --ro: #FF7A9C; --ink: #1C0B12; --pa: #FFFBFA;
  --mu: #6B5560; --tx2: #4A3A41; --ln: rgba(28,11,18,.12); --tile: #F3E9E2; --ok: #0E6B44;
  --serif: "DM Serif Display", Georgia, serif; --sans: "DM Sans", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --c-bg: #121117; --c-bar: #1C1B23; --c-fg: #F1F0F6; --c-mu: #A4A1B3; --c-ln: #2F2D3A; --c-on: #E9D3A6; --c-on-fg: #1C0B12; --c-frame: #000000; color-scheme: dark; } }
:root[data-theme="dark"] { --c-bg: #121117; --c-bar: #1C1B23; --c-fg: #F1F0F6; --c-mu: #A4A1B3; --c-ln: #2F2D3A; --c-on: #E9D3A6; --c-on-fg: #1C0B12; --c-frame: #000000; color-scheme: dark; }
html, body { height: 100%; }
body { background: var(--c-bg); color: var(--c-fg); font-family: var(--sans); display: flex; flex-direction: column; overflow: hidden; }
* { box-sizing: border-box; }

/* control bar */
.bar { background: var(--c-bar); border-bottom: 1px solid var(--c-ln); padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.bar h1 { margin: 0 auto 0 0; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.bar h1 svg { height: 28px; width: auto; }
.seg { display: inline-flex; background: var(--c-bg); border-radius: 12px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { font: inherit; font-size: 13px; font-weight: 500; border: 0; background: transparent; color: var(--c-mu); padding: 7px 12px; border-radius: 9px; cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--c-on); color: var(--c-on-fg); }
.seg button:focus-visible, .site :focus-visible { outline: 3px solid #4F7BFF; outline-offset: 2px; }
.grp { display: flex; align-items: center; gap: 8px; }
.grp > span { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--c-mu); }

/* stage */
.stage { flex: 1; min-height: 0; display: flex; justify-content: center; align-items: stretch; padding: 14px max(14px, env(safe-area-inset-left, 0px)) 14px max(14px, env(safe-area-inset-right, 0px)); }
.dev { position: relative; width: 100%; height: 100%; border-radius: 14px; overflow: hidden; background: var(--pa); box-shadow: 0 0 0 1px var(--c-ln), 0 30px 60px -40px rgba(0,0,0,.4); }
.dev.mobile { width: 390px; max-width: 100%; height: min(844px, 100%); border-radius: 44px; box-shadow: 0 0 0 10px var(--c-frame), 0 40px 80px -30px rgba(0,0,0,.5); margin-top: 6px; }
.scroller { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; container: site / inline-size; scroll-behavior: smooth; }
.layer { position: absolute; inset: 0; pointer-events: none; z-index: 40; }
.layer > * { pointer-events: auto; }

/* ===== Jazz94 site ===== */
.site { background: var(--pa); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.55; min-height: 100%; }
.site a { color: inherit; }
.site button { font: inherit; color: inherit; }
.w { max-width: 1320px; margin: 0 auto; padding-left: 20px; padding-right: 20px; }
.serif { font-family: var(--serif); font-weight: 400; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.kick { font-size: 13px; font-weight: 500; letter-spacing: .24em; text-transform: uppercase; color: var(--bx); }
.h2 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: clamp(34px, 4cqi, 56px); line-height: 1; text-wrap: balance; }
.h2 em, .hero h2 em { color: var(--bx); }
.sec { padding-bottom: 96px; }
.row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 16px; margin-bottom: 28px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; border-radius: 999px; padding: 15px 28px; font-weight: 700; font-size: 15px; text-decoration: none; border: 1.5px solid transparent; cursor: pointer; position: relative; overflow: hidden; }
.btn-p { background: var(--bx); color: var(--pa) !important; }
.btn-d { background: var(--ink); color: var(--pa) !important; }
.btn-c { background: var(--ch); color: var(--ink) !important; }
.btn-o { border-color: var(--ink); background: transparent; color: var(--ink) !important; }
.btn-sm { padding: 8px 14px; font-size: 13px; }
.chip { border: 1.5px solid var(--ink); background: transparent; padding: 9px 18px; border-radius: 999px; font-size: 14px; font-weight: 500; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--pa); }
.ph { position: relative; overflow: hidden; background: var(--tile); }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(28,11,18,0) 40%, rgba(28,11,18,.75) 100%); }
.g4 { display: grid; grid-template-columns: repeat(auto-fill, minmax(max(150px, calc((100% - 72px) / 4)), 1fr)); gap: 36px 24px; }
.g3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(max(240px, calc((100% - 48px) / 3)), 1fr)); gap: 24px; }
.g3p { display: grid; grid-template-columns: repeat(auto-fill, minmax(max(150px, calc((100% - 48px) / 3)), 1fr)); gap: 36px 24px; }
.ib { display: grid; place-items: center; background: none; border: 0; padding: 8px; cursor: pointer; text-decoration: none; position: relative; }
.ib svg { width: 22px; height: 22px; }

/* ticker + header */
.ticker { background: var(--ink); color: var(--ch); overflow: hidden; white-space: nowrap; font-size: 12px; font-weight: 500; letter-spacing: .16em; padding: 9px 0; }
.marq { display: inline-flex; gap: 36px; padding-left: 36px; }
.marq span.s { color: var(--ro); }
.hdr { position: sticky; top: 0; z-index: 20; background: rgba(255,251,250,.94); backdrop-filter: blur(12px); border-bottom: 1px solid var(--ln); }
.hdr-top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding-top: 12px; padding-bottom: 8px; }
.hdr-l { display: flex; align-items: center; gap: 4px; justify-self: start; }
.hdr-r { display: flex; align-items: center; gap: 2px; justify-self: end; }
.hdr-search { display: flex; gap: 8px; font-size: 14px; letter-spacing: .08em; }
.hamb { display: none; }
.logo-l { display: block; line-height: 0; }
.logo-l svg { width: 186px; height: auto; }
.bagn { position: absolute; top: 2px; right: 0; min-width: 18px; height: 18px; border-radius: 9px; background: var(--bx); color: var(--pa); font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; padding: 0 4px; }
.navrow { display: flex; justify-content: safe center; gap: 32px; overflow-x: auto; white-space: nowrap; font-size: 13px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; padding-bottom: 12px; }
.navrow a { text-decoration: none; padding-bottom: 3px; }
.navrow a.sale { color: var(--bx); }
.navrow a[aria-current="page"] { text-decoration: underline; text-underline-offset: 6px; }

/* hero */
.hero { display: flex; flex-wrap: wrap; gap: 48px; align-items: center; padding-top: 40px; padding-bottom: 88px; }
.hero-t { flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 22px; }
.hero h2 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: clamp(56px, 8.6cqi, 132px); line-height: .92; letter-spacing: -.015em; }
.hero p { margin: 0; font-size: 18px; max-width: 42ch; color: var(--tx2); }
.trust { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 13px; color: var(--mu); }
.hero-v { flex: 1 1 440px; min-width: 0; position: relative; display: flex; justify-content: center; }
.hero-blob { position: absolute; width: 78%; aspect-ratio: 1; border-radius: 50%; background: var(--ch); top: 6%; right: -4%; }
.hero-img { position: relative; width: 100%; max-width: 520px; aspect-ratio: 4 / 5; border-radius: 999px 999px 32px 32px; }
.hero-img img { object-position: 50% 30%; }
.badge-spin { position: absolute; top: 2%; left: 2%; width: 124px; height: 124px; }
.chipcard { position: absolute; left: 0; bottom: 8%; background: var(--pa); border-radius: 20px; padding: 10px 16px 10px 10px; display: flex; align-items: center; gap: 12px; text-decoration: none; box-shadow: 0 20px 40px -20px rgba(28,11,18,.45); }
.chipcard .ph { width: 56px; height: 56px; border-radius: 14px; }

/* category tiles */
.tile { position: relative; display: block; aspect-ratio: 4 / 5; border-radius: 28px; text-decoration: none; }
.tile .cap { position: absolute; left: 24px; right: 24px; bottom: 22px; display: flex; justify-content: space-between; align-items: end; gap: 12px; color: var(--pa); }
.tile .cap small { display: block; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--ch); }
.tile .cap b { font-family: var(--serif); font-weight: 400; font-size: 36px; line-height: 1; }
.arrow { width: 46px; height: 46px; border-radius: 50%; background: var(--pa); color: var(--ink); display: grid; place-items: center; flex: none; }

/* product card */
.card { position: relative; display: flex; flex-direction: column; gap: 12px; }
.card .ph { display: block; aspect-ratio: 4 / 5; border-radius: 22px; }
.tag { position: absolute; top: 12px; left: 12px; background: var(--pa); color: var(--ink); font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; z-index: 2; }
.heart { position: absolute; top: 10px; right: 10px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--pa); color: var(--bx); display: grid; place-items: center; cursor: pointer; z-index: 2; }
.heart svg { width: 18px; height: 18px; }
.meta { display: flex; flex-direction: column; gap: 4px; padding: 0 4px 4px; }
.cat-l { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--mu); }
.pname { font-family: var(--serif); font-size: 20px; line-height: 1.2; text-decoration: none; }
.dots { display: flex; gap: 6px; }
.dots i { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(28,11,18,.2); }
.pr { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-top: 4px; }

/* editorial + banner */
.edit { display: flex; flex-wrap: wrap; background: var(--chl); border-radius: 36px; overflow: hidden; }
.edit > .ph { flex: 1 1 420px; min-height: 540px; }
.edit > .ph img { position: absolute; inset: 0; object-position: 50% 25%; }
.edit-t { flex: 1 1 420px; min-width: 0; padding: 56px 48px; display: flex; flex-direction: column; gap: 20px; justify-content: center; }
.look { display: flex; align-items: center; gap: 14px; background: var(--pa); border-radius: 16px; padding: 8px 16px 8px 8px; text-decoration: none; }
.look .ph { width: 56px; height: 56px; border-radius: 12px; flex: none; }
.banner { display: flex; flex-wrap: wrap; align-items: center; gap: 40px; background: var(--ink); color: var(--pa); border-radius: 36px; padding: 56px; }
.banner .ph { flex: 1 1 380px; height: 420px; border-radius: 26px; }
.svc { display: grid; grid-template-columns: repeat(auto-fill, minmax(max(150px, calc((100% - 48px) / 4)), 1fr)); gap: 20px; border-top: 1px solid var(--ln); padding-top: 40px; }
.svc div { display: flex; flex-direction: column; gap: 6px; }
.svc .ico { width: 46px; height: 46px; border-radius: 14px; background: var(--chl); color: var(--bx); display: grid; place-items: center; }
.club { background: var(--bx); color: var(--pa); }
.club .w { display: flex; flex-wrap: wrap; gap: 28px; align-items: center; justify-content: space-between; padding-top: 64px; padding-bottom: 64px; }
.club input { flex: 1 1 220px; min-width: 0; padding: 16px 20px; border: 1.5px solid rgba(255,251,250,.55); border-radius: 999px; background: transparent; color: var(--pa); font: inherit; }
.club input::placeholder { color: #F1D9E0; }
.ftr { background: var(--ink); color: #E8DCDF; }
.ftr-cols { display: grid; grid-template-columns: repeat(auto-fill, minmax(max(150px, calc((100% - 128px) / 5)), 1fr)); gap: 32px; padding-top: 64px; padding-bottom: 32px; }
.ftr h4 { margin: 0 0 6px; color: var(--ch); font-size: 12px; letter-spacing: .2em; text-transform: uppercase; }
.ftr a { color: #E8DCDF; text-decoration: none; font-size: 14px; display: block; padding: 3px 0; }
.ftr-b { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; font-size: 13px; color: #B8A6AD; border-top: 1px solid rgba(255,251,250,.12); padding-top: 20px; padding-bottom: 32px; }

/* category page */
.crumb { font-size: 13px; color: var(--mu); padding-top: 20px; }
.crumb a { color: var(--mu); }
.cbanner { position: relative; min-height: 300px; border-radius: 32px; display: flex; align-items: flex-end; margin-top: 16px; }
.cbanner img { position: absolute; inset: 0; object-position: 50% 60%; }
.cbanner .shade { background: linear-gradient(90deg, rgba(28,11,18,.8) 0%, rgba(28,11,18,.2) 60%, rgba(28,11,18,0) 100%); }
.cbanner .t { position: relative; padding: 40px 44px; color: var(--pa); display: flex; flex-direction: column; gap: 8px; max-width: 560px; }
.ctools { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; padding-top: 24px; }
.ctools select { font: inherit; font-size: 14px; padding: 9px 14px; border-radius: 12px; border: 1.5px solid rgba(28,11,18,.25); background: var(--pa); color: var(--ink); }
.mfilt { display: none; }
.cmain { display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start; padding-top: 28px; padding-bottom: 40px; }
.aside { flex: 1 1 230px; max-width: 100%; display: flex; flex-direction: column; gap: 22px; font-size: 14px; }
.aside fieldset { border: 0; border-top: 1px solid var(--ln); margin: 0; padding: 16px 0 0; display: flex; flex-direction: column; gap: 10px; }
.aside legend { font-size: 12px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; padding: 0 0 10px; float: left; width: 100%; }
.aside label { display: flex; gap: 10px; align-items: center; cursor: pointer; }
.aside input { width: 18px; height: 18px; accent-color: var(--bx); }
.sw { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid rgba(28,11,18,.2); cursor: pointer; }
.sizes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.sizes button { border: 1.5px solid rgba(28,11,18,.2); background: var(--pa); border-radius: 10px; padding: 8px 0; font-size: 13px; cursor: pointer; }
.cgrid { flex: 999 1 560px; min-width: 0; }
.promo { position: relative; display: flex; align-items: flex-end; aspect-ratio: 4 / 5; border-radius: 22px; text-decoration: none; }
.promo img { position: absolute; inset: 0; }
.promo .t { position: relative; padding: 24px; color: var(--pa); display: flex; flex-direction: column; gap: 6px; }
.promo .t b { font-family: var(--serif); font-weight: 400; font-size: 28px; line-height: 1.05; }
.promo .t small { font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--ch); }

/* product page */
.pdp { display: flex; flex-wrap: wrap; gap: 56px; align-items: flex-start; padding-top: 20px; padding-bottom: 80px; }
.gal { flex: 1.15 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.gal .main { aspect-ratio: 1; border-radius: 32px; }
.thumbs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.thumbs button { padding: 0; aspect-ratio: 1; border-radius: 18px; overflow: hidden; border: 2px solid transparent; background: var(--tile); cursor: pointer; }
.thumbs button[aria-pressed="true"] { border-color: var(--bx); }
.thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
.info { flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 22px; }
.info h1 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: clamp(40px, 4.4cqi, 60px); line-height: 1; }
.vars { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--ln); padding-top: 20px; }
.swatch { width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--pa); box-shadow: 0 0 0 2px rgba(28,11,18,.2); cursor: pointer; }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--bx); }
.buyrow { display: flex; gap: 10px; flex-wrap: wrap; align-items: stretch; }
.qty { display: flex; align-items: center; border: 1.5px solid rgba(28,11,18,.25); border-radius: 999px; }
.qty button { width: 44px; height: 50px; border: 0; background: none; font-size: 20px; cursor: pointer; }
.qty span { min-width: 22px; text-align: center; font-family: var(--mono); }
.pin { background: var(--chl); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.pin input, .field input, .cpn input { padding: 12px 14px; border: 1.5px solid rgba(28,11,18,.2); border-radius: 12px; font: inherit; font-size: 15px; background: #FFFFFF; color: var(--ink); min-width: 0; }
.acc button { width: 100%; display: flex; justify-content: space-between; align-items: center; background: none; border: 0; border-top: 1px solid var(--ln); padding: 16px 0; font-weight: 700; cursor: pointer; text-align: left; }
.acc button span:last-child { font-size: 20px; transition: transform .3s; }
.acc button[aria-expanded="true"] span:last-child { transform: rotate(45deg); }
.acc p { margin: 0 0 16px; color: var(--tx2); font-size: 15px; }
.revs { border: 1px solid var(--ln); border-radius: 28px; padding: 36px; display: flex; flex-wrap: wrap; gap: 24px; align-items: center; justify-content: space-between; }

/* cart */
.cartm { display: flex; flex-wrap: wrap; gap: 48px; align-items: flex-start; padding-bottom: 80px; }
.lines { flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.ship { background: var(--chl); border-radius: 20px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
.track { height: 6px; border-radius: 6px; background: rgba(28,11,18,.1); overflow: hidden; }
.track i { display: block; height: 100%; background: var(--bx); border-radius: 6px; }
.line { display: flex; gap: 20px; flex-wrap: wrap; padding-bottom: 20px; border-bottom: 1px solid var(--ln); }
.line .ph { width: 120px; height: 146px; border-radius: 18px; flex: none; }
.line .d { flex: 1 1 200px; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.link { background: none; border: 0; padding: 0; font-size: 14px; text-decoration: underline; cursor: pointer; }
.sum { flex: 1 1 330px; min-width: 0; position: sticky; top: 130px; background: #FFFFFF; border: 1px solid rgba(28,11,18,.14); border-radius: 28px; padding: 28px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 30px 60px -40px rgba(28,11,18,.35); }
.sum .r { display: flex; justify-content: space-between; font-size: 15px; gap: 12px; }
.cpn { display: flex; gap: 8px; }
.cpn input { flex: 1; text-transform: uppercase; }
.empty { border: 1px dashed rgba(28,11,18,.25); border-radius: 24px; padding: 48px 24px; text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; }

/* checkout */
.cohdr { border-bottom: 1px solid var(--ln); }
.cohdr .w { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 14px; padding-bottom: 14px; max-width: 1180px; }
.steps { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 14px; padding-top: 28px; }
.steps span { border: 1.5px solid rgba(28,11,18,.3); padding: 6px 14px; border-radius: 999px; color: var(--mu); }
.steps span.on { background: var(--ink); border-color: var(--ink); color: var(--pa); }
.steps i { width: 28px; height: 1.5px; background: rgba(28,11,18,.25); }
.co { display: flex; flex-wrap: wrap; gap: 48px; align-items: flex-start; padding-top: 28px; padding-bottom: 72px; }
.co form { flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 36px; }
.co fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.co legend { padding: 0 0 14px; font-family: var(--serif); font-size: 30px; }
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(max(200px, calc((100% - 14px) / 2)), 1fr)); gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; color: var(--tx2); }
.opt { border: 2px solid rgba(28,11,18,.15); background: #FFFFFF; border-radius: 16px; transition: border-color .25s, background .25s; }
.opt[data-on="1"] { border-color: var(--bx); background: #FFF3F5; }
.opt > button { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; text-align: left; border: 0; background: none; padding: 16px 18px; cursor: pointer; }
.radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--ink); display: grid; place-items: center; flex: none; }
.radio i { width: 10px; height: 10px; border-radius: 50%; }

/* L1 wireframe skin for the new parts */
.lv1 .fbh > .bg img { visibility: hidden; }
.lv1 .fbh > .bg { background: linear-gradient(to top right, transparent calc(50% - 1px), #C8C8C8 50%, transparent calc(50% + 1px)), linear-gradient(to top left, transparent calc(50% - 1px), #C8C8C8 50%, transparent calc(50% + 1px)), #E9E9E9; }

.lv1 .fbh, .lv1 .fbh .en-h1, .lv1 .fbh .en-h1 em, .lv1 .fbh p, .lv1 .fbh .trust, .lv1 .fbh .en-eye, .lv1 .fbh .crumb, .lv1 .fbh .crumb a, .lv1 .en-count, .lv1 .en-count li.on { color: #222 !important; }

.lv1 .ov:not(.solid), .lv1 .ov:not(.solid) .ib, .lv1 .ov:not(.solid) .hdr-search, .lv1 .ov:not(.solid) .navrow a, .lv1 .ov:not(.solid) .secure { color: #222 !important; }

/* L3 motion for the new parts */
@keyframes enIn { from { opacity: 0; transform: translateX(-70px) skewX(-6deg); } to { opacity: 1; transform: none; } }
@keyframes enBar { from { transform: skewX(-24deg) scaleX(0); } to { transform: skewX(-24deg) scaleX(1); } }
@keyframes enPulse { 0% { box-shadow: 0 0 0 0 rgba(255,122,156,.6); } 100% { box-shadow: 0 0 0 12px rgba(255,122,156,0); } }
.lv3.enter .en-h1 span, .lv3.enter .en-h1 em { animation: enIn .9s cubic-bezier(.2,.7,.2,1) backwards; }
.lv3.enter .en-h1 em { animation-delay: .16s; }
.lv3.enter .speed { animation: enBar 1s .4s cubic-bezier(.2,.7,.2,1) backwards; }
.lv3 .en-dot { animation: enPulse 1.6s ease-out infinite; }

/* ===== Content pages + cart drawer ===== */
.ab-split { display: flex; flex-wrap: wrap; gap: 56px; align-items: center; }

.vals { display: grid; grid-template-columns: repeat(auto-fill, minmax(max(220px, calc((100% - 48px) / 3)), 1fr)); gap: 24px; }
.val { background: var(--chl); border-radius: 28px; padding: 30px; display: flex; flex-direction: column; gap: 12px; }

@container site (max-width: 760px) {

      '<div style="border-top:1px solid rgba(28,11,18,.15);padding-top:14px;display:flex;flex-direction:column;gap:8px;font-size:15px"><div style="display:flex;justify-content:space-between"><span>Subtotal</span><span class="mono">' + fmt(t.sub) + '</span></div>' + (S.applied ? '<div style="display:flex;justify-content:space-between;color:var(--ok)"><span>GROOVE10</span><span class="mono">−' + fmt(t.disc) + '</span></div>' : '') + (S.gift ? '<div style="display:flex;justify-content:space-between"><span>Gift wrap</span><span class="mono">₹99</span></div>' : '') + '<div style="display:flex;justify-content:space-between"><span>Delivery</span><span class="mono">' + (ships[S.ship][2] ? fmt(ships[S.ship][2]) : (t.del ? fmt(t.del) : 'Free')) + '</span></div><div style="display:flex;justify-content:space-between;align-items:baseline;padding-top:8px"><b style="font-size:18px">Total</b><span class="mono" style="font-size:22px">' + fmt(total) + '</span></div></div><a href="#" data-go="cart" style="font-size:14px">Edit bag</a></aside></section>' +
      foot + notes();
  }

  /* ---------- overlay ---------- */
  function overlay() {
    let h = '';

      const cats = [['Sunglasses', 'Sunglasses', 'From ₹1,999'], ['Watches', 'Watches', 'From ₹3,999'], ['Shoes', 'Shoes', 'From ₹2,999'], ['New In', 'All', '10 pieces'], ['Gifts', 'All', 'Ready to wrap'], ['Sale', 'All', 'Up to 30% off']];
      h += '<div class="scrim" data-act="menu"></div><div class="drawer" role="dialog" aria-modal="true" aria-label="Menu"><div class="top">' + logo(false).replace('<svg ', '<svg class="lg" ') + '<button type="button" class="ib" data-act="menu" aria-label="Close menu">' + ic.close + '</button></div>' +
        '<nav aria-label="Shop">' + cats.map((c) => '<a href="#" data-go="cat" data-v="' + c[1] + '"' + (c[0] === 'Sale' ? ' style="color:var(--bx)"' : '') + '><span>' + c[0] + '</span><small>' + c[2] + '</small></a>').join('') + '</nav>' +
        '<div class="util"><a href="#">' + ic.user + 'Sign in or create account</a><a href="#">' + ic.heart(false) + 'Wishlist</a><a href="#" data-go="shipping">' + ic.box + 'Track order</a><a href="#" data-go="returns">' + ic.help + 'Help and returns</a><a href="#" data-go="about">' + ic.user.replace('<circle cx="12" cy="8" r="4"/>', '<circle cx="12" cy="12" r="9"/>') + 'About Jazz94</a><a href="#" data-go="contact">' + ic.help + 'Contact us</a></div>' +
        '<div class="promo-d"><span class="kick" style="color:var(--ch)">The Club</span><b class="serif" style="font-size:22px;font-weight:400">Early access to Friday drops</b><a href="#" data-go="home" class="btn btn-c btn-sm" style="align-self:flex-start">Join free</a></div></div>';
    }
    if (S.cd) {
      const t = totals(), left = Math.max(0, 999 - t.sub);
      const up = P.find((x) => !S.bag.some((b) => b.id === x.id) && x.c !== (S.bag[0] ? byId(S.bag[0].id).c : ''));
      h += '<div class="scrim" data-act="cd"></div><aside class="cdrawer" role="dialog" aria-modal="true" aria-label="Your bag"><div class="cd-top"><b class="serif">Your bag <span>(' + bagCount() + ')</span></b><button type="button" class="ib" data-act="cd" aria-label="Close bag">' + ic.close + '</button></div>' +
        '<div class="ship cd-ship"><span>' + (t.sub === 0 ? 'Add ₹999 or more for free delivery.' : left === 0 ? '✓ You have unlocked free delivery.' : 'Add ' + fmt(left) + ' more for free delivery.') + '</span><span class="track"><i class="bar-i" style="width:' + Math.min(100, Math.round(t.sub / 999 * 100)) + '%"></i></span></div>' +
        '<div class="cd-lines">' + (S.bag.length ? S.bag.map((x) => { const p = byId(x.id); return '<div class="cd-line"><a href="#" class="ph" data-go="pdp" data-v="' + p.id + '"><img src="' + IMG(p.img) + '" alt="' + p.n + '"></a><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px"><a href="#" class="pname" data-go="pdp" data-v="' + p.id + '" style="font-size:18px">' + p.n + '</a><span style="font-size:13px;color:var(--mu)">' + x.v + '</span><div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto"><div class="qty"><button type="button" data-act="lq" data-v="' + p.id + ':-1" aria-label="Decrease quantity of ' + p.n + '" style="height:36px;width:36px">−</button><span>' + x.q + '</span><button type="button" data-act="lq" data-v="' + p.id + ':1" aria-label="Increase quantity of ' + p.n + '" style="height:36px;width:36px">+</button></div><span class="mono">' + fmt(p.p * x.q) + '</span></div><button type="button" class="link" data-act="rm" data-v="' + p.id + '" style="align-self:flex-start;font-size:13px;color:var(--bx)">Remove</button></div></div>'; }).join('') : '<div class="empty" style="padding:36px 16px"><span class="serif" style="font-size:26px">Your bag is empty</span><a href="#" class="btn btn-p btn-sm" data-go="cat" data-v="All">Shop new in</a></div>') + '</div>' +
        (up ? '<div class="cd-up"><span class="ph"><img src="' + IMG(up.img) + '" alt=""></span><span style="flex:1;min-width:0"><small class="cat-l">Pairs well with</small><br><b style="font-weight:500;font-size:14px">' + up.n + '</b><br><span class="mono" style="font-size:13px">' + fmt(up.p) + '</span></span><button type="button" class="btn btn-d btn-sm" data-act="add" data-v="' + up.id + '">Add +</button></div>' : '') +
        '<div class="cd-foot"><div class="sum-r"><span>Subtotal</span><b class="mono">' + fmt(t.sub) + '</b></div><span style="font-size:12px;color:var(--mu)">Delivery and discounts are worked out at checkout.</span><a href="#" class="btn btn-p" data-go="checkout"' + (S.bag.length ? '' : ' aria-disabled="true"') + '>Checkout · ' + fmt(t.sub) + '</a><a href="#" class="btn btn-o" data-go="cart">View bag</a></div></aside>';
    }
    if (S.note) h += '<div class="toast" role="status" style="padding:12px 20px"><span>' + S.note + '</span></div>';
    else if (S.toast) h += '<div class="toast" role="status"><span>Added to bag · <b>' + S.toast + '</b></span><a href="#" data-go="cart">View bag</a></div>';
    return h;
  }

  function fixOv(root) { root.querySelectorAll('.ov').forEach((h) => { h.style.marginBottom = -h.offsetHeight + 'px'; }); }

    /* ---------- canvas build ---------- */
  const PG = { home, cat, pdp, cart, checkout, about, contact, returns, shipping };
  const PROTO = '../01-prototype/index.html';
  const LV = [[1, 'L1 · Wireframes', 'Grey boxes, layout and numbered notes'], [2, 'L2 · Visual design', 'Bordeaux + energy · full-bleed heroes · Editorial Luxe · real photography'], [3, 'L3 · Final', 'Bordeaux + energy with motion: full-bleed heroes, sliding headlines, speed-lines, band, countdown, hover zoom and lift']];
  const fr = (lv, name, dev, body, extra, cls) => '<div class="fr"><div class="fl"><b>L' + lv + ' · ' + name + '</b> · ' + dev + '</div><div class="fb' + (dev.indexOf('Desktop') === 0 ? '' : ' mob') + (extra ? ' ' + (cls || 'menu') : '') + '" style="width:' + (dev.indexOf('Desktop') === 0 ? 1440 : 390) + 'px"><div class="site lv' + lv + (lv === 3 ? ' enter' : '') + '">' + body + '</div>' + (extra || '') + '</div></div>';
  let out = '';
  LV.forEach(([lv, t, d]) => {
    out += '<section class="crow" id="row' + lv + '"><header class="rt"><h2>' + t + '</h2><p>' + d + '</p></header><div class="frames">';
    PAGES.forEach(([pg, name]) => {
      Object.assign(S, { lv, page: pg, tab: 'All', catTab: 'All', sort: 'featured', menu: false, toast: null, filt: false, placed: false });
      const body = PG[pg]();
      out += '<div class="pair">' + fr(lv, name, 'Desktop', body) + fr(lv, name, 'Mobile', body) + '</div>';
    });
    Object.assign(S, { lv, page: 'home', menu: true });
    const hb = home(), ov = overlay();
    S.menu = false;
    out += fr(lv, 'Home', 'Mobile · menu open', hb, '<div class="layer' + (lv === 3 ? ' anim' : '') + (lv === 1 ? ' lv1' : '') + '">' + ov + '</div>');
    Object.assign(S, { lv, page: 'home', menu: false, cd: true });
    const dbody = home(), dov = overlay();
    S.cd = false;
    const lay = '<div class="layer' + (lv === 3 ? ' anim' : '') + (lv === 1 ? ' lv1' : '') + '">' + dov + '</div>';
    out += fr(lv, 'Cart drawer', 'Desktop · open', dbody, lay, 'drw') + fr(lv, 'Cart drawer', 'Mobile · open', dbody, lay, 'menu');
    out += '</div></section>';
  });
  const world = $('world'), vp = $('vp');
  world.innerHTML = out;
  fixOv(world);
  world.addEventListener('click', (e) => e.preventDefault());

  /* ---------- pan and zoom ---------- */
  let k = 0.3, tx = 0, ty = 0;
  const apply = () => { world.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + k + ')'; $('zv').textContent = Math.round(k * 100) + '%'; };
  const clampK = (v) => Math.max(0.03, Math.min(1.5, v));
  function zoomAt(nk, px, py) { nk = clampK(nk); tx = px - (px - tx) * (nk / k); ty = py - (py - ty) * (nk / k); k = nk; apply(); }
  function jump(lv) {
    const row = $('row' + lv), w = vp.clientWidth;
    k = w < 700 ? 0.2 : 0.3;
    tx = 24 - row.offsetLeft * k; ty = 24 - row.offsetTop * k; apply();
  }
  function fitAll() {
    const W = world.scrollWidth, H = world.scrollHeight;
    k = clampK(Math.min(vp.clientWidth / W, vp.clientHeight / H) * 0.96);
    tx = (vp.clientWidth - W * k) / 2; ty = (vp.clientHeight - H * k) / 2; apply();
  }
  vp.addEventListener('wheel', (e) => {
    e.preventDefault();
    const r = vp.getBoundingClientRect();
    if (e.ctrlKey || e.metaKey) zoomAt(k * Math.exp(-e.deltaY * 0.01), e.clientX - r.left, e.clientY - r.top);
    else { tx -= e.deltaX; ty -= e.deltaY; apply(); }
  }, { passive: false });
  const pts = new Map(); let last = null;
  vp.addEventListener('pointerdown', (e) => { vp.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); vp.classList.add('drag'); last = null; });
  vp.addEventListener('pointermove', (e) => {
    if (!pts.has(e.pointerId)) return;
    const prev = pts.get(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 1) { tx += e.clientX - prev.x; ty += e.clientY - prev.y; apply(); }
    else if (pts.size === 2) {
      const [a, b] = [...pts.values()]; const r = vp.getBoundingClientRect();
      const dist = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2 - r.left, my = (a.y + b.y) / 2 - r.top;
      if (last) { tx += mx - last.mx; ty += my - last.my; zoomAt(k * dist / last.dist, mx, my); }
      last = { dist, mx, my };
    }
  });
  const up = (e) => { pts.delete(e.pointerId); last = null; if (!pts.size) vp.classList.remove('drag'); };
  vp.addEventListener('pointerup', up); vp.addEventListener('pointercancel', up);
  const center = () => [vp.clientWidth / 2, vp.clientHeight / 2];
  $('zin').onclick = () => zoomAt(k * 1.25, ...center());
  $('zout').onclick = () => zoomAt(k / 1.25, ...center());
  $('fit').onclick = fitAll;
  document.querySelectorAll('[data-jump]').forEach((b) => (b.onclick = () => jump(+b.dataset.jump)));
  document.addEventListener('keydown', (e) => {
    if (e.target.closest('input,select,textarea')) return;
    if (e.key === '+' || e.key === '=') zoomAt(k * 1.25, ...center());
    else if (e.key === '-') zoomAt(k / 1.25, ...center());
    else if (e.key === '0') fitAll();
    else if (e.key.startsWith('Arrow')) { const s = 80; if (e.key === 'ArrowLeft') tx += s; if (e.key === 'ArrowRight') tx -= s; if (e.key === 'ArrowUp') ty += s; if (e.key === 'ArrowDown') ty -= s; apply(); }
  });
  jump(2);
  setTimeout(() => world.querySelectorAll('.enter').forEach((n) => n.classList.remove('enter')), 2500);
})();
